name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.12.0
          - os: ubuntu-latest
            node: 24.x
          - os: ubuntu-latest
            node: 26.x
          - os: windows-latest
            node: 22.12.0
          - os: windows-latest
            node: 24.x
          - os: macos-latest
            node: 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run repo:check
      - run: npm test
      - run: npm run smoke

  package:
    name: Package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:types
      - name: Inspect packed file set
        run: npm run package:check
      - name: Install archive offline and scan the demo
        run: npm run package:smoke

  browser:
    name: Real Chromium and Axe integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Enable sandboxed Chromium on Ubuntu
        # Exact binary attachments only; do not disable Chromium's sandbox or
        # Ubuntu's system-wide unprivileged-user-namespace restriction.
        run: |
          node scripts/ci/chromium-sandbox-profile.js > "$RUNNER_TEMP/modular-ci-chromium.apparmor"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/modular-ci-chromium.apparmor" /etc/apparmor.d/modular-ci-chromium
          sudo apparmor_parser --replace /etc/apparmor.d/modular-ci-chromium
      - run: npm run test:browser
      - run: npm run test:accuracy
      - name: Remove CI-only Chromium sandbox profile
        if: always()
        run: |
          if [ -f /etc/apparmor.d/modular-ci-chromium ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/modular-ci-chromium
            sudo rm -- /etc/apparmor.d/modular-ci-chromium
          fi
